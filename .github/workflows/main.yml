name: Build SillySwiftGram IPA

on:
  workflow_dispatch:
  push:
    branches:
      - l10n

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch WebRTC lifetimebound
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("third-party/webrtc/webrtc/api/candidate.h")
          s = p.read_text()
          old = "void set_type(absl::string_view type ABSL_ATTRIBUTE_LIFETIME_BOUND)"
          new = "void set_type(absl::string_view type)"
          if old not in s:
              raise SystemExit("ERROR: expected WebRTC code not found")
          p.write_text(s.replace(old, new, 1))
          print("WebRTC patched successfully")
          PY

      - name: Fix LegacyComponents for newer clang
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) FLAnimatedImage: float compared with enum
          p = Path("submodules/LegacyComponents/Sources/FLAnimatedImage.m")
          s = p.read_text()
          n, c = re.subn(
              r"<=\s*(FLAnimatedImageDataSizeCategory(?:All|Default))",
              r"<= (CGFloat)\1",
              s,
          )
          if c == 0:
              raise SystemExit("ERROR: FLAnimatedImage pattern not found")
          p.write_text(n)
          print("FLAnimatedImage patched:", c)

          # 2) kCGBitmapByteOrder* | kCGImageAlpha*: bitwise op between different enums
          pat = re.compile(r"(kCGBitmapByteOrder\w+)\s*\|\s*(kCGImageAlpha\w+)")
          total = 0
          gpu_changed = 0
          for f in Path("submodules/LegacyComponents/Sources").rglob("*.m"):
              t = f.read_text(errors="ignore")
              n, c = pat.subn(r"\1 | (CGBitmapInfo)\2", t)
              if c:
                  f.write_text(n)
                  total += c
                  print("Patched", f, c)
                  if f.name == "GPUImageFramebuffer.m":
                      gpu_changed = c
          if gpu_changed == 0:
              raise SystemExit("ERROR: GPUImageFramebuffer.m pattern not found")
          print("Bitmap info patched:", total)
          PY
          echo 'build --objccopt=-Wno-error=enum-float-conversion' >> .bazelrc
          echo 'build --objccopt=-Wno-error=enum-enum-conversion' >> .bazelrc
          echo 'build --objccopt=-Wno-error=deprecated-declarations' >> .bazelrc
          echo 'build --objccopt=-Wno-error=misleading-indentation' >> .bazelrc
          echo 'build --objccopt=-Wno-error=unused-but-set-variable' >> .bazelrc
          echo 'build --objccopt=-Wno-error=sometimes-uninitialized' >> .bazelrc
          echo 'build --objccopt=-Wno-error=nontrivial-memcall' >> .bazelrc
          echo 'build --objccopt=-Wno-error=incompatible-pointer-types' >> .bazelrc

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: sillyswiftgram-bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sillyswiftgram-bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}-
            sillyswiftgram-bazel-${{ runner.os }}-

      - name: Show environment
        run: |
          xcodebuild -version
          python3 --version

      - name: Build IPA
        timeout-minutes: 330
        run: |
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64

      - name: Save Bazel cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: sillyswiftgram-bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      
      - name: Prepare IPA
        run: |
          set -e

          IPA="bazel-bin/Telegram/Swiftgram.ipa"

          if [ ! -f "$IPA" ]; then
            echo "IPA not found!"
            find bazel-bin -name '*.ipa' -print
            exit 1
          fi

          echo "Removing embedded Apple Watch app..."

          python3 - "$IPA" <<'PY'
          import sys
          import re
          import zipfile
          from pathlib import Path

          ipa = Path(sys.argv[1])
          temp = ipa.with_name("Swiftgram.stripped.ipa")

          pattern = re.compile(
              r"^Payload/[^/]+\.app/Watch(?:/|$)"
          )

          with zipfile.ZipFile(ipa, "r") as src:
              files = src.infolist()
              removed = [
                  f.filename for f in files
                  if pattern.match(f.filename)
              ]

              if not removed:
                  raise SystemExit(
                      "ERROR: Embedded Watch app not found"
                  )

              with zipfile.ZipFile(temp, "w") as dst:
                  for item in files:
                      if pattern.match(item.filename):
                          continue
                      dst.writestr(item, src.read(item.filename))

          temp.replace(ipa)

          print(f"Removed {len(removed)} Watch entries:")
          for name in removed:
              print(" -", name)

          print("Watch app successfully removed!")
          PY

          mkdir -p dist
          cp "$IPA" dist/SillySwiftGram.ipa

          ls -lh dist/


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SillySwiftGram-IPA
          path: dist/SillySwiftGram.ipa
          if-no-files-found: error
          retention-days: 14
